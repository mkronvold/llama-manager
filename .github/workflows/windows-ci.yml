name: Windows CI

# Guards the Windows-specific hardening in this fork (fork-only asset detection fixes,
# extraction robustness, taskkill-based shutdown, %APPDATA%/%LOCALAPPDATA% config dirs,
# etc.) against regressions on native Windows/PowerShell.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test (vitest)
        run: npm test
